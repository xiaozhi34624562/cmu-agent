# Part 4.3b: async GRPO at high staleness WITHOUT importance weighting.
# Differs from p2b: the async trainer with max_staleness 4 (as in the iw run)
# and the cross_entropy loss, which weights tokens by the advantage alone and
# applies no importance ratio (see tinker_adapter.to_tinker_datum).
model:
  base_model: Qwen/Qwen3.5-4B
  chat_template: scottyrl/chat_templates/qwen3_5.jinja
  enable_thinking: false      # Number Search: answer directly, no reasoning block
  preserve_thinking_history: true
  lora_rank: 32
  max_tokens: 256
  temperature: 1.0

train:
  env: number_search
  agent: xml_toolcall
  algo: grpo
  group_size: 8
  groups_per_batch: 8
  num_workers: 8
  max_staleness: 4
  queue_capacity: 16
  loss_fn: cross_entropy
  lr: 1.0e-5
  grad_clip_norm: 1.0
  num_steps: 50
  eval_every: 10
  eval_k: 4
  eval_tasks: 50
  seed: 11768
  run_name: p43_number_search_async_stale4_noiw
  resume: false               # --set train.resume=true to continue after a crash
  resume_save_every: 10       # resumable checkpoint every N optimizer steps
  trajectory_log_every: 5     # full transcripts every N steps under runs/
  # wandb_project: 11768-a3   # uncomment (or --set) to enable wandb
