# Part 2a: REINFORCE on Number Search, synchronous.
# Differs from p2b: group_size 1 (no group baseline, so the advantage is the
# raw reward) and the unclipped importance_sampling loss instead of ppo.
model:
  base_model: Qwen/Qwen3.5-4B
  chat_template: scottyrl/chat_templates/qwen3_5.jinja
  enable_thinking: false      # Number Search: answer directly, no reasoning block
  preserve_thinking_history: true
  lora_rank: 32
  max_tokens: 256
  temperature: 1.0

train:
  env: number_search
  agent: xml_toolcall
  algo: reinforce
  group_size: 1
  tasks_per_batch: 8
  loss_fn: importance_sampling
  lr: 1.0e-5
  grad_clip_norm: 1.0
  num_steps: 50
  eval_every: 10
  eval_k: 4
  eval_tasks: 50
  seed: 11768
  run_name: p2a_number_search_reinforce
  resume: false               # --set train.resume=true to continue after a crash
  resume_save_every: 10       # resumable checkpoint every N optimizer steps
  trajectory_log_every: 5     # full transcripts every N steps under runs/
  # wandb_project: 11768-a3   # uncomment (or --set) to enable wandb
